<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>POOLROOMS · 池核</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b1a1a'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%2379d6c9'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23c9efe8'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%232ba6a0'/%3E%3C/svg%3E" />
  <style>
    :root {
      --ink: #eef6f1;
      --ink-dim: rgba(232, 244, 238, 0.56);
      --teal: #8fd8cc;
      --line: rgba(230, 245, 239, 0.28);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #07100f;
      color: var(--ink);
      font-family: "Helvetica Neue", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; }

    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

    /* ---------- loader ---------- */
    #loader {
      position: absolute; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 26px;
      background: radial-gradient(ellipse at 50% 42%, #112220 0%, #070d0d 68%);
      transition: opacity 1.2s ease, visibility 1.2s;
    }
    #loader.done { opacity: 0; visibility: hidden; }
    #loader .ring {
      width: 52px; height: 52px; border-radius: 50%;
      border: 1px solid rgba(180, 228, 218, 0.14);
      border-top-color: rgba(190, 236, 226, 0.8);
      animation: spin 1.6s linear infinite;
    }
    #loader p {
      margin: 0; font-size: 11px; letter-spacing: 0.42em;
      color: rgba(220, 240, 233, 0.5); text-indent: 0.42em;
      font-weight: 300;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- intro ---------- */
    #intro {
      position: absolute; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse at 50% 46%, rgba(6, 16, 16, 0.02) 0%, rgba(4, 11, 11, 0.5) 78%),
        linear-gradient(to bottom, rgba(4, 10, 10, 0.42) 0%, rgba(4, 10, 10, 0.02) 30%, rgba(4, 10, 10, 0.02) 66%, rgba(4, 10, 10, 0.55) 100%);
      opacity: 0; visibility: hidden;
      transition: opacity 1.1s ease, visibility 1.1s;
      pointer-events: none;
    }
    #intro.show { opacity: 1; visibility: visible; pointer-events: auto; }
    .intro-inner {
      text-align: center;
      transform: translateY(-2vh);
      animation: rise 1.8s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .eyebrow {
      margin: 0 0 26px;
      font-size: 10px; font-weight: 300;
      letter-spacing: 0.62em; text-indent: 0.62em;
      color: rgba(214, 238, 231, 0.58);
    }
    h1 {
      margin: 0;
      font-family: "Bodoni MT", Didot, "Times New Roman", Georgia, serif;
      font-weight: 400;
      font-size: clamp(46px, 9.2vw, 116px);
      letter-spacing: 0.16em; text-indent: 0.16em;
      line-height: 1.02;
      color: #f0f6ef;
      text-shadow: 0 4px 60px rgba(0, 0, 0, 0.45), 0 0 22px rgba(190, 240, 228, 0.12);
    }
    .zh {
      margin: 24px 0 46px;
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: clamp(12px, 1.3vw, 15px);
      letter-spacing: 0.68em; text-indent: 0.68em;
      font-weight: 400;
      color: rgba(226, 244, 237, 0.62);
    }
    #enterBtn {
      pointer-events: auto;
      appearance: none;
      cursor: pointer;
      background: rgba(221, 242, 235, 0.045);
      border: 1px solid var(--line);
      color: rgba(240, 250, 246, 0.9);
      font-family: inherit;
      font-size: 11px; font-weight: 400;
      letter-spacing: 0.34em; text-indent: 0.34em;
      padding: 15px 38px 15px 42px;
      border-radius: 1px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.5s ease, border-color 0.5s ease, letter-spacing 0.5s ease;
    }
    #enterBtn:hover {
      background: rgba(220, 244, 236, 0.13);
      border-color: rgba(236, 250, 245, 0.6);
      letter-spacing: 0.42em; text-indent: 0.42em;
    }
    .hint {
      position: absolute; left: 0; right: 0; bottom: -96px;
      margin: 0;
      font-size: 10px; font-weight: 300;
      letter-spacing: 0.2em;
      color: rgba(226, 242, 236, 0.58);
    }

    /* ---------- hud ---------- */
    #hud {
      position: absolute; inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.4s ease;
    }
    #hud.show { opacity: 1; }
    .hud-left, .hud-right {
      position: absolute; bottom: 24px;
      font-size: 10px; font-weight: 300;
      letter-spacing: 0.22em;
      color: rgba(228, 243, 237, 0.55);
      text-shadow: 0 1px 8px rgba(0, 8, 8, 0.55);
    }
    .hud-left { left: 30px; }
    .hud-right { right: 26px; }
    .hud-left .sep { color: rgba(228, 243, 237, 0.18); margin: 0 12px; }
    #soundBtn {
      pointer-events: auto;
      appearance: none; background: none; border: none; cursor: pointer;
      font-family: inherit; font-size: 10px; font-weight: 300;
      letter-spacing: 0.22em;
      color: rgba(228, 243, 237, 0.55);
      padding: 4px 2px;
      transition: color 0.4s;
    }
    #soundBtn:hover { color: rgba(240, 250, 246, 0.85); }
    #crosshair {
      position: absolute; left: 50%; top: 50%;
      width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px;
      border-radius: 50%;
      background: rgba(240, 250, 246, 0.34);
      box-shadow: 0 0 6px rgba(220, 250, 242, 0.18);
      opacity: 0;
      transition: opacity 1s;
    }
    #hud.show #crosshair { opacity: 1; }

    /* ---------- toast ---------- */
    #toast {
      position: absolute; left: 50%; bottom: 84px;
      transform: translateX(-50%) translateY(6px);
      font-size: 10px; font-weight: 300;
      letter-spacing: 0.3em; text-indent: 0.3em;
      color: rgba(232, 247, 241, 0.66);
      background: rgba(6, 16, 16, 0.5);
      border: 1px solid rgba(220, 245, 237, 0.12);
      padding: 9px 20px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .touch-only { display: none; }
    @media (pointer: coarse) {
      .desktop-only { display: none; }
      .touch-only { display: inline; }
      .hud-left { font-size: 11px; }
      .hint { font-size: 11px; }
    }
    @media (max-width: 640px) {
      .hud-left { left: 16px; bottom: 18px; }
      .hud-right { right: 14px; bottom: 16px; }
      .hint { bottom: -88px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="ui">
    <div id="loader">
      <div class="ring"></div>
      <p>正在注水 · FILLING</p>
    </div>

    <div id="intro">
      <div class="intro-inner">
        <p class="eyebrow">A LIMINAL SPACE</p>
        <h1>POOLROOMS</h1>
        <p class="zh">池 核 · 无 尽 之 池</p>
        <button id="enterBtn"><span>进 入 水 域</span></button>
        <p class="hint">
          <span class="desktop-only">点击后以第一人称漫游 · WASD 移动 · 鼠标环视 · M 声音</span>
          <span class="touch-only">拖动环视 · 双指缩放</span>
        </p>
      </div>
    </div>

    <div id="hud">
      <div class="hud-left">
        <span class="desktop-only">WASD 移动<span class="sep">/</span>鼠标环视<span class="sep">/</span>SHIFT 加速<span class="sep">/</span>ESC 松开</span>
        <span class="touch-only">拖动环视 · 双指缩放</span>
      </div>
      <div class="hud-right">
        <button id="soundBtn">◍ 声音 开</button>
      </div>
      <div id="crosshair"></div>
    </div>

    <div id="toast"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
